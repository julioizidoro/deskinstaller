<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <title th:text="'OS Nº ' + ${os.numero}">Ordem de Serviço</title>
    <style>
        /*<![CDATA[*/
        body {
            font-family: Arial, sans-serif;
            font-size: 12px;
            margin: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .section-title {
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 8px;
            border-bottom: 2px solid #000;
            padding-bottom: 3px;
        }
        .info-table {
            width: 100%;
            margin-bottom: 10px;
        }
        .info-table td {
            padding: 3px 5px;
            vertical-align: top;
        }
        .info-label {
            font-weight: bold;
            width: 120px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }
        th, td {
            border: 1px solid #000;
            padding: 6px;
            text-align: left;
        }
        th {
            background: #f2f2f2;
            font-weight: bold;
        }
        .right {
            text-align: right;
        }
        .total-box {
            margin-top: 10px;
            text-align: right;
            font-size: 14px;
            font-weight: bold;
        }
        /*]]>*/
    </style>
</head>
<body>

<div class="header">
    <h2>Onda Térmica</h2>
    <h3>Ordem de Serviço Nº <span th:text="${os.numero} ?: 'N/A'">""</span></h3>
</div>

<div>
    <div class="section-title">Dados do Cliente</div>
    <table class="info-table">
        <tr>
            <td class="info-label">Cliente:</td>
            <td colspan="3">
                <span th:text="${os.clienteCodigo} ?: '-'">""</span> -
                <span th:text="${os.clienteNome} ?: '-'">""</span>
            </td>
        </tr>
        <tr>
            <td class="info-label">Fone:</td>
            <td colspan="3" th:text="${os.foneCel} ?: '-'">""</td>
        </tr>
        <tr>
            <td class="info-label">Endereço:</td>
            <td colspan="3" th:text="${(os.endereco ?: '') + (os.bairro != null and os.bairro != '' ? ', ' + os.bairro : '') + (os.cidade != null and os.cidade != '' ? ', ' + os.cidade : '')}">""</td>
        </tr>
    </table>
</div>

<div>
    <div class="section-title">Dados da Ordem de Serviço</div>
    <table class="info-table">
        <tr>
            <td class="info-label">Data/Hora:</td>
            <td colspan="3" th:text="${(os.data != null ? #dates.format(os.data,'dd/MM/yyyy') : '') + (os.hora != null and os.hora != '' ? ' ' + os.hora : '')} ?: '-'">""</td>
        </tr>
        <tr>
            <td class="info-label">Técnico:</td>
            <td th:text="${os.tecnico} ?: '-'">""</td>
        </tr>
    </table>
</div>

<div>
    <div class="section-title">Descrição dos Serviços</div>
    <table>
        <tbody th:each="servico : ${os.servicos}">
        <tr>
            <!-- Linha 1: Aparelho -->
            <td class="info-label">Aparelho:</td>
            <td colspan="5" th:text="${servico.aparelho} ?: ''">""</td>
        </tr>
        <tr>
            <!-- Linha 2: Servidor e Descrição do Serviço -->
            <td class="info-label">Servico:</td>
            <td colspan="3" th:text="${servico.descricao} ?: '-'">""</td>
        </tr>
        <tr>
            <!-- Linha vazia para espaçamento -->
            <td colspan="6" style="border: none; padding: 3px; height: 1px;"></td>
        </tr>
        </tbody>
    </table>

    <div class="total-box">
        TOTAL DA ORDEM DE SERVIÇO: R$ <span th:text="${os.total} ?: '0,00'">480,00</span>
    </div>
</div>

</body>
</html>
