# Configuracao do servidor
server.port=8080
server.servlet.context-path=/
spring.config.import=optional:file:.env[.properties]

# Configuracao do MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dk_db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Configuracao do JPA/Hibernate
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
# O banco legado guarda booleanos como TINYINT(1). Sem isto o Hibernate 6
# espera BIT e a validacao de schema falha em toda coluna "ativo"/"situacao".
spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=TINYINT
spring.jpa.open-in-view=false

# Configuracao de logging
logging.level.br.com.deskinstaller=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# Configuracao de encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Configuracao de JSON
spring.jackson.serialization.indent_output=true
spring.jackson.serialization.write-dates-as-timestamps=false

# Configuracoes operacionais
app.database.monitoring.enabled=${APP_DATABASE_MONITORING_ENABLED:false}
app.database.validation.enabled=${APP_DATABASE_VALIDATION_ENABLED:true}
app.database.log-details-enabled=${APP_DATABASE_LOG_DETAILS_ENABLED:false}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}
app.security.enabled=${APP_SECURITY_ENABLED:true}
app.security.public-docs-enabled=${APP_SECURITY_PUBLIC_DOCS_ENABLED:true}
# Segredo JWT: sem valor padrao no codigo. Gere o seu com: openssl rand -base64 48
# Em prod a aplicacao nao sobe sem ele; em dev, se ausente, uma chave efemera e gerada por execucao.
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:}
app.security.jwt.expiration-seconds=${APP_SECURITY_JWT_EXPIRATION_SECONDS:14400}
app.security.refresh-token.expiration-seconds=${APP_SECURITY_REFRESH_TOKEN_EXPIRATION_SECONDS:604800}

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Integracao com Google Calendar
# Os valores NAO ficam no codigo: venham de variaveis de ambiente (.env em dev,
# Java Options do servico em producao). Vazios = integracao desligada.
google.calendar.client-id=${GOOGLE_CLIENT_ID:}
google.calendar.client-secret=${GOOGLE_CLIENT_SECRET:}
google.calendar.redirect-uri=${GOOGLE_REDIRECT_URI:}
google.calendar.calendar-id=${GOOGLE_CALENDAR_ID:}
google.calendar.refresh-token=${GOOGLE_REFRESH_TOKEN:}
google.calendar.tokeninfo-timeout-ms=${GOOGLE_TOKENINFO_TIMEOUT_MS:5000}
google.calendar.duracao-padrao-minutos=${GOOGLE_CALENDAR_DURACAO_MINUTOS:60}
google.calendar.lembrete-minutos=${GOOGLE_CALENDAR_LEMBRETE_MINUTOS:60}
google.calendar.notificar-convidados=${GOOGLE_CALENDAR_NOTIFICAR:true}

# Servidor de WhatsApp
whatsapp.api.url=${WHATSAPP_API_URL:http://localhost:3002}
whatsapp.api.key=${WHATSAPP_API_KEY:}
whatsapp.api.default-session-id=${WHATSAPP_DEFAULT_SESSION_ID:}
whatsapp.api.connect-timeout-ms=${WHATSAPP_CONNECT_TIMEOUT_MS:10000}
whatsapp.api.read-timeout-ms=${WHATSAPP_READ_TIMEOUT_MS:30000}

# Links de agendamento da OS (front)
os.notificacao.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

# Upload de midia do WhatsApp (limite do servidor: 10MB por arquivo)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
