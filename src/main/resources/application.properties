# Configuracao do servidor
server.port=8080
server.servlet.context-path=/
spring.config.import=optional:file:.env[.properties]

# Configuracao do MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dk_db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# Configuracao do JPA/Hibernate
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jpa.open-in-view=false

# Configuracao de logging
logging.level.br.com.deskinstaller=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# Configuracao de encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Configuracao de JSON
spring.jackson.serialization.indent_output=true
spring.jackson.serialization.write-dates-as-timestamps=false

# Configuracoes operacionais
app.database.monitoring.enabled=${APP_DATABASE_MONITORING_ENABLED:false}
app.database.validation.enabled=${APP_DATABASE_VALIDATION_ENABLED:true}
app.database.log-details-enabled=${APP_DATABASE_LOG_DETAILS_ENABLED:false}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}
app.security.enabled=${APP_SECURITY_ENABLED:true}
app.security.public-docs-enabled=${APP_SECURITY_PUBLIC_DOCS_ENABLED:true}
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:ZGVza2luc3RhbGxlci1kZXYtamF3dC1zZWNyZXQtdmVyeS1sb25nLTEyMzQ1Njc4OTA=}
app.security.jwt.expiration-seconds=${APP_SECURITY_JWT_EXPIRATION_SECONDS:3600}
app.security.refresh-token.expiration-seconds=${APP_SECURITY_REFRESH_TOKEN_EXPIRATION_SECONDS:604800}

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
