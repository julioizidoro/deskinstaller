spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
app.database.monitoring.enabled=false
app.database.log-details-enabled=false
app.security.public-docs-enabled=false
# Configuravel por ambiente: banco legado costuma exigir baseline antes de ligar.
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# Atras de proxy reverso (nginx/Apache), respeita X-Forwarded-* para que a
# aplicacao saiba que a requisicao original era HTTPS.
server.forward-headers-strategy=NATIVE

# Nao expor a versao do servidor nem detalhes de erro do container.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Front de producao usado no link de confirmacao do agendamento
os.notificacao.frontend-url=${APP_FRONTEND_URL:https://deskinstaller.ondatermica.com.br}
